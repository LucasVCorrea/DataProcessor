name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  dataprocessor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install uv
        run: python -m pip install uv
      - name: Sync workspace
        run: uv sync --frozen --all-packages
      - name: Compile Berisso pipeline
        run: |
          uv run --package airflow-google-worker python -m compileall -q \
            projects/aset/berisso \
            base_workers/google-worker/src/google_worker
