[project]
name = "airflow-base-worker"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "airflow-base",
    "requests"
]

[tool.uv.sources]
airflow-base = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
module-name = "base_worker"