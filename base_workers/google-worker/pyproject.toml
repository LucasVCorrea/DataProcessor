[project]
name = "airflow-google-worker"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "airflow-base",
    "airflow-base-worker",
    "pandas",
    "pyarrow",
    "gspread",
    "oauth2client"
]

[tool.uv.sources]
airflow-base = { workspace = true }
airflow-base-worker = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
module-name = "google_worker"